[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "projeto-si-ml-api"
version = "1.0.0"
description = "API de Autenticação por Dinâmica de Digitação (Django + DRF + M2005_IDB)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.15,<4.0",
    "scikit-learn>=1.7,<2.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<4.0",
    "joblib>=1.4,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "apscheduler>=3.11,<4.0",
    "gunicorn>=23.0,<24.0",
    "django-environ>=0.11,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-django>=4.9,<5.0",
    "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
include = ["config*", "biometrics*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
